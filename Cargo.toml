[workspace]
resolver = "3"
members = ["crates/synth-core", "crates/synth-app", "crates/synth-lab"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

# Audio has to be computed in real time; unoptimised dependencies (and DSP code) can
# cause dropouts even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
