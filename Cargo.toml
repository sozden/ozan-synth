[workspace]
resolver = "3"
members = ["crates/ozan-core", "crates/ozan-ui", "crates/ozan", "crates/ozan-lab", "crates/ozan-plugin"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

# Audio has to be computed in real time; unoptimised dependencies (and DSP code) can
# cause dropouts even in debug builds.
[profile.dev]
opt-level = 1
# Line numbers in backtraces are enough; full debug info made target/debug ~10 GB
# and once filled the disk.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
