[package]
name = "ozan-lab"
description = "Listening lab: renders presets to WAV with spectrograms and measurements, records the real output through WASAPI loopback"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ozan-core = { path = "../ozan-core" }
cpal = "0.18.2"
png = "0.18.1"
rustfft = "6"
libloading = "0.9"
# Same pinned commit nih-plug uses (see crates/ozan-plugin).
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }

[target.'cfg(windows)'.dependencies]
# The test host's window, for checking the plugin's editor.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
