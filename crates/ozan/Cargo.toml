[package]
name = "ozan"
description = "OZAN Synth, standalone synthesizer: sound card output, USB MIDI input and the panel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ozan"
path = "src/main.rs"

[dependencies]
ozan-core = { path = "../ozan-core", features = ["serde"] }
cpal = "0.18.2"
eframe = "0.31"
ozan-ui = { path = "../ozan-ui" }
midir = "0.11.1"
rtrb = "0.4.1"
