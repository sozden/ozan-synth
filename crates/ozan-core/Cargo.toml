[package]
name = "ozan-core"
description = "Sound engine of OZAN Synth: voices, oscillators, envelopes, MIDI parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No required dependencies: the same engine is meant to run in the standalone
# app and, later, in a plugin. `serde` (optional) reads and writes patches.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
